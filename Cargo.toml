[package]
name = "helium-wsl"
version = "0.2.3"
edition = "2024"
description = "A modern Wayland shell library wrapping layer-shika"
license = "MIT"
repository = "https://github.com/xZepyx/helium"
readme = "README.md"
keywords = ["wayland", "shell", "slint", "hyprland", "layer-shell"]
categories = ["gui", "os::linux-apis"]

[dependencies]
layer-shika = "0.3"
layer-shika-adapters = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = "0.4"
zbus = { version = "4", optional = true }
inotify = { version = "0.10", optional = true }
helium-wsl-macros = { path = "./helium-macros", version = "0.2.3" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
zvariant = "4"
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "helium"
path = "src/bin/helium-cli.rs"
required-features = ["cli"]

[features]
default = ["compositors", "services"]

# Compositor backends
compositors = ["compositor-hyprland", "compositor-niri"]
compositor-hyprland = []
compositor-niri = []

# Service modules
services = ["service-audio", "service-bluetooth", "service-network", "service-power", "service-powerprofiles"]
service-audio = ["zbus"]
service-bluetooth = ["zbus"]
service-network = ["zbus"]
service-power = ["zbus"]
service-powerprofiles = ["zbus"]

# CLI binary
cli = ["clap"]

[workspace]
members = [".", "helium-macros"]
